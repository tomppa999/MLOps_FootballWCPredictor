# Bronze -> Silver -> Gold builds the live pipeline; the strand* stages below
# reconstruct the post-tournament D.1 analysis offline from DVC-tracked inputs.
#
# `dvc repro figures` walks the reconstruction/RQ DAG: `figures` depends on the
# audit report and the round leaderboards even though it does not read them, so
# that one target includes the checks.
#
# silver and gold are frozen: the analysis reads historical Gold at the commit
# each inference cycle actually served, never a freshly rebuilt one.
stages:
  silver:
    cmd: python -m src.silver.build_silver
    frozen: true
    deps:
      - data/raw
      - src/silver/
    outs:
      - data/silver

  gold:
    cmd: python -m src.gold.build_gold
    frozen: true
    deps:
      - data/silver
      - src/gold/
    outs:
      - data/gold

  # inputs/fixture_settlement.csv is a dep of every strand that parses results
  # and never an out: only `snapshot_inputs --only settlement` can produce it,
  # and that needs online DVC access to historical Bronze.
  strand1:
    cmd: python -m src.analysis.run_d1 --strands 1 --skip-tag-check
    deps:
      - data/analysis/live
      - data/raw
      - data/reconstruction/inputs
      - src/analysis/replay_common.py
      - src/analysis/rq_datasets/paths.py
      - src/analysis/run_d1.py
      - src/analysis/strand1_frozen_shadow.py
      - src/gold/
      - src/inference/
      - src/models/
      - src/monitoring/
      - src/silver/
    outs:
      - data/reconstruction/strand1_frozen_shadow

  strand2:
    cmd: python -m src.analysis.run_d1 --strands 2 --skip-tag-check
    deps:
      - data/analysis/live
      - data/raw
      - data/reconstruction/inputs
      - src/analysis/replay_common.py
      - src/analysis/rq_datasets/paths.py
      - src/analysis/run_d1.py
      - src/analysis/strand2_brackets.py
      - src/gold/
      - src/inference/
      - src/models/
      - src/monitoring/
      - src/silver/
    outs:
      - data/reconstruction/strand2_brackets

  strand3:
    cmd: python -m src.analysis.run_d1 --strands 3 --skip-tag-check
    deps:
      - data/analysis/live
      - src/analysis/replay_common.py
      - src/analysis/rq_datasets/export_live.py
      - src/analysis/rq_datasets/paths.py
      - src/analysis/run_d1.py
      - src/analysis/strand3_backfill.py
      - src/gold/
      - src/inference/
      - src/models/
      - src/monitoring/
      - src/silver/
    outs:
      - data/reconstruction/strand3_backfill

  strand5:
    cmd: python -m src.analysis.run_d1 --strands 5 --skip-tag-check
    deps:
      - data/analysis/live
      - data/raw
      - data/reconstruction/inputs
      - src/analysis/replay_common.py
      - src/analysis/rq_datasets/paths.py
      - src/analysis/run_d1.py
      - src/analysis/strand4_entropy.py
      - src/analysis/strand5_frozen_entropy.py
      - src/gold/
      - src/inference/
      - src/models/
      - src/monitoring/
      - src/silver/
    outs:
      - data/reconstruction/strand5_frozen_entropy

  rq_datasets:
    cmd: python -m src.analysis.rq_datasets
    deps:
      - data/analysis/live
      - data/reconstruction/strand1_frozen_shadow
      - data/reconstruction/strand2_brackets
      - data/reconstruction/strand3_backfill
      - data/reconstruction/strand5_frozen_entropy
      - src/analysis/replay_common.py
      - src/analysis/rq_datasets/
    outs:
      - data/analysis/rq1_matches.csv
      - data/analysis/rq2_entropy.csv
      - data/analysis/rq3_calibration.csv

  # s5.champion_identity diffs strand 5 predictions against the logged lambdas
  # in inputs/logged_predictions/, so both must be pulled for the audit to mean
  # anything.  "Same numbers" is 0 fails; the warns are expected.
  audit:
    cmd: python -m src.analysis.audit_reconstruction
    deps:
      - data/analysis/live
      - data/analysis/rq2_entropy.csv
      - data/reconstruction/inputs
      - data/reconstruction/strand1_frozen_shadow
      - data/reconstruction/strand2_brackets
      - data/reconstruction/strand3_backfill
      - data/reconstruction/strand5_frozen_entropy
      - src/analysis/audit_reconstruction.py
      - src/analysis/replay_common.py
      - src/analysis/rq_datasets/paths.py
      - src/gold/
    outs:
      - data/reconstruction/audit_report.json

  leaderboards:
    cmd: python -m src.analysis.round_leaderboards
    deps:
      - data/analysis/rq1_matches.csv
      - src/analysis/round_leaderboards.py
      - src/analysis/rq_datasets/paths.py
    outs:
      - data/analysis/round_leaderboards.csv

  # RQ1 main table: paired per_round - frozen differences per match for the
  # three models whose cadences actually diverge, with bootstrap CIs and
  # sign-flip permutation p-values.  The docs/tables CSVs are the paper's and
  # thesis's single source, so they are committed to Git like the figures.
  rq1:
    cmd: python -m src.analysis.rq1_paired
    deps:
      - data/analysis/rq1_matches.csv
      - src/analysis/round_leaderboards.py
      - src/analysis/rq1_paired.py
      - src/analysis/rq_datasets/paths.py
    outs:
      - data/analysis/rq1_paired_diffs.csv
      - docs/tables/rq1_paired_phase.csv:
          cache: false
      - docs/tables/rq1_paired_rounds.csv:
          cache: false
      - docs/tables/rq1_pairing_coverage.csv:
          cache: false

  # RQ2: paired frozen − per_round Shannon-entropy differences on twin
  # inference cycles (nearest frozen within 30 min), cycle and distinct-state
  # grains, with bootstrap CIs and sign-flip permutation p-values.
  rq2:
    cmd: python -m src.analysis.rq2_paired
    deps:
      - data/analysis/rq2_entropy.csv
      - src/analysis/rq1_paired.py
      - src/analysis/rq2_paired.py
      - src/analysis/rq_datasets/paths.py
    outs:
      - data/analysis/rq2_paired_diffs.csv
      - docs/tables/rq2_paired_stage.csv:
          cache: false
      - docs/tables/rq2_paired_matchday.csv:
          cache: false
      - docs/tables/rq2_pairing_coverage.csv:
          cache: false

  # RQ3: ECE + 3-way Brier decomposition over time (frozen vs per_round),
  # with paired match bootstrap / arm-swap inference and a trend test for
  # frozen calibration degradation.  rq3_calibration.csv is a consistency
  # check against the pre-binned reliability rows.
  rq3:
    cmd: python -m src.analysis.rq3_calibration_drift
    deps:
      - data/analysis/rq1_matches.csv
      - data/analysis/rq3_calibration.csv
      - src/analysis/round_leaderboards.py
      - src/analysis/rq1_paired.py
      - src/analysis/rq3_calibration_drift.py
      - src/analysis/rq_datasets/paths.py
    outs:
      - docs/tables/rq3_calibration_rounds.csv:
          cache: false
      - docs/tables/rq3_calibration_phase.csv:
          cache: false
      - docs/tables/rq3_trend.csv:
          cache: false

  # Current RQ1/RQ3 results: score the saved forecasts against 90-minute outcomes.
  # Use -s to avoid replaying the retired upstream pipeline.
  regulation_time:
    cmd: python -m src.analysis.regulation_time
    deps:
      - data/analysis/rq1_matches.csv
      - data/raw/api_football/fixtures
      - data/mappings/team_mapping_master_merged.csv
      - src/analysis/regulation_time.py
      - src/analysis/rq_datasets/build_rq_datasets.py
      - src/analysis/rq1_paired.py
      - src/analysis/rq3_calibration_drift.py
      - src/analysis/round_leaderboards.py
      - src/analysis/rq_datasets/paths.py
      - src/models/evaluation.py
      - src/inference/features.py
    outs:
      - data/analysis/regulation_time
      - docs/tables/regulation_time:
          cache: false

  # Optional history only. Neither the current analysis nor figures depend on it.
  regulation_time_comparison:
    cmd: python -m src.analysis.regulation_time_comparison
    deps:
      - data/analysis/regulation_time/outcome_audit.csv
      - docs/tables/regulation_time/rq1_paired_phase.csv
      - docs/tables/regulation_time/rq3_calibration_phase.csv
      - docs/tables/regulation_time/rq3_trend.csv
      - docs/tables/rq1_paired_phase.csv
      - docs/tables/rq3_calibration_phase.csv
      - docs/tables/rq3_trend.csv
      - src/analysis/regulation_time_comparison.py
    outs:
      - docs/tables/regulation_time_comparison:
          cache: false
      - docs/notes/regulation_time_comparison.md:
          cache: false

  # Isolated diagnosis of the first Poisson refit; historical inputs are pinned
  # by Git/DVC and model SHA256 in the module. Run with -s to exclude upstream work.
  poisson_refit_diagnostic:
    cmd: python -m src.analysis.poisson_refit_diagnostic
    deps:
      - src/analysis/poisson_refit_diagnostic.py
      - src/analysis/replay_common.py
      - src/models/candidates/poisson_glm.py
      - src/models/data_split.py
      - src/models/config.py
      - src/gold/schema.py
      - src/inference/features.py
      - data/reconstruction/inputs/models/wc_shadow/v88/python_model.pkl
      - data/reconstruction/inputs/logged_predictions/all_models.parquet
      - data/reconstruction/inputs/fixture_settlement.csv
      - data/raw/api_football/fixtures
      - data/mappings/team_mapping_master_merged.csv
      - data/tournament/wc2026.json
    outs:
      - docs/tables/poisson_refit_diagnostic:
          cache: false
      - docs/notes/poisson_refit_diagnostic.md:
          cache: false

  rq2_refit_boundary:
    cmd: python -m src.analysis.entropy_refit_boundary
    deps:
      - data/analysis/rq1_matches.csv
      - data/analysis/rq2_entropy.csv
      - src/analysis/entropy_refit_boundary.py
      - src/analysis/plot_entropy_trajectory.py
      - src/analysis/rq2_paired.py
      - src/analysis/rq_datasets/paths.py
    outs:
      - docs/tables/rq2_refit_boundary.csv:
          cache: false

  figures:
    cmd:
      - python -m src.analysis.plot_entropy_trajectory
      - python -m src.analysis.plot_entropy_stages
      - python -m src.analysis.rq3_calibration_overview --input data/analysis/regulation_time/rq3_calibration.csv --output docs/figures/regulation-time/calibration-group-vs-ko.png --contrast-output docs/figures/regulation-time/calibration-contrast-group-vs-ko.png --outcome-label "90-minute outcomes"
    deps:
      - data/analysis/rq1_matches.csv
      - data/analysis/rq2_entropy.csv
      - data/analysis/regulation_time/rq3_calibration.csv
      - data/reconstruction/audit_report.json
      - docs/tables/regulation_time/rq1_paired_phase.csv
      - docs/tables/regulation_time/rq1_paired_rounds.csv
      - docs/tables/regulation_time/rq1_pairing_coverage.csv
      - docs/tables/rq2_paired_stage.csv
      - docs/tables/rq2_paired_matchday.csv
      - docs/tables/rq2_pairing_coverage.csv
      - docs/tables/regulation_time/rq3_calibration_rounds.csv
      - docs/tables/regulation_time/rq3_calibration_phase.csv
      - docs/tables/regulation_time/rq3_trend.csv
      - src/analysis/plot_entropy_trajectory.py
      - src/analysis/plot_entropy_stages.py
      - src/analysis/rq3_calibration_overview.py
      - src/analysis/rq1_paired.py
      - src/analysis/rq2_paired.py
      - src/analysis/rq_datasets/paths.py
    outs:
      # Committed to Git for the thesis, so DVC tracks them without caching.
      - docs/figures/entropy-trajectory.png:
          cache: false
      - docs/figures/entropy-stages.png:
          cache: false
      - docs/figures/entropy-targets:
          cache: false
      - docs/figures/regulation-time/calibration-group-vs-ko.png:
          cache: false
      - docs/figures/regulation-time/calibration-contrast-group-vs-ko.png:
          cache: false

  poisson_joint_prepare:
    cmd: python -m src.analysis.poisson_joint_prepare
    deps:
      - data/thesis_inputs/baseline/data/analysis/rq1_matches.csv
      - data/thesis_inputs/baseline/data/analysis/rq2_entropy.csv
      - data/thesis_inputs/poisson/models
      - data/thesis_inputs/poisson/gold
      - data/thesis_inputs/poisson/gold_history.tar.gz
      - data/thesis_inputs/poisson/strand5_predictions.parquet
      - data/thesis_inputs/poisson/trial_cycle_map.csv
      - data/analysis/live/inference_cycles.csv
      - data/reconstruction/inputs/fixture_settlement.csv
      - data/reconstruction/inputs/logged_predictions/all_models.parquet
      - data/reconstruction/inputs/models/manifest.csv
      - data/raw/api_football/fixtures
      - data/mappings/team_mapping_master_merged.csv
      - data/tournament/wc2026.json
      - src/analysis/poisson_joint_prepare.py
      - src/analysis/rq2_outages.py
      - src/analysis/poisson_refit_diagnostic.py
      - src/analysis/replay_common.py
      - src/analysis/rq_datasets/paths.py
      - src/analysis/strand4_entropy.py
      - src/gold/context_features.py
      - src/gold/temporal_features.py
      - src/gold/rolling_features.py
      - src/inference/features.py
      - src/inference/run.py
      - src/models/config.py
      - src/models/data_split.py
      - src/models/evaluation.py
    outs:
      - data/analysis/poisson_joint_inputs

  poisson_joint_replay:
    cmd: python -m src.analysis.poisson_joint_replay
    deps:
      - data/analysis/poisson_joint_inputs
      - data/tournament/wc2026.json
      - src/analysis/poisson_joint_replay.py
      - src/analysis/replay_common.py
      - src/inference/simulation.py
    outs:
      - data/analysis/poisson_joint

  poisson_joint_validate:
    cmd: python -m src.analysis.poisson_joint_validate
    deps:
      - data/analysis/poisson_joint
      - data/analysis/poisson_joint_inputs
      - data/thesis_inputs/baseline/data/analysis/rq1_matches.csv
      - data/thesis_inputs/baseline/data/analysis/rq2_entropy.csv
      - data/thesis_inputs/poisson
      - data/thesis_inputs/sensitivity.tar.gz
      - data/analysis/live/fixtures.csv
      - data/reconstruction/inputs/models/manifest.csv
      - data/reconstruction/inputs/fixture_settlement.csv
      - data/raw/api_football/fixtures
      - data/mappings/team_mapping_master_merged.csv
      - data/tournament/wc2026.json
      - src/analysis/poisson_joint_prepare.py
      - src/analysis/rq2_outages.py
      - src/analysis/poisson_joint_replay.py
      - src/analysis/poisson_joint_validate.py
      - src/analysis/strand4_entropy.py
      - src/analysis/replay_common.py
      - src/inference/simulation.py
      - src/inference/features.py
      - src/models/candidates/poisson_glm.py
      - src/models/evaluation.py
    outs:
      - data/analysis/poisson_joint_checks.json

  rq2_public_outages:
    cmd: python -m src.analysis.rq2_outage_comparison
    deps:
      - data/analysis/poisson_joint
      - data/analysis/poisson_joint_inputs
      - data/thesis_inputs/poisson/gold
      - data/thesis_inputs/poisson/strand5_predictions.parquet
      - data/reconstruction/inputs/models
      - data/reconstruction/inputs/logged_predictions/all_models.parquet
      - data/reconstruction/inputs/fixture_settlement.csv
      - data/raw/api_football/fixtures
      - data/mappings/team_mapping_master_merged.csv
      - data/tournament/wc2026.json
      - src/analysis/rq2_outage_comparison.py
      - src/analysis/rq2_outages.py
      - src/analysis/poisson_joint_prepare.py
      - src/analysis/poisson_joint_replay.py
      - src/analysis/replay_common.py
      - src/inference/features.py
      - src/inference/simulation.py
      - src/models/config.py
      - src/models/data_split.py
    outs:
      - data/analysis/rq2_public_outages.csv
